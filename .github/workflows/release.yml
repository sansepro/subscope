name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        shell: cmd
        run: build.bat --ci
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path bin/Subscope.exe,LICENSE,THIRD_PARTY.md,README.md -DestinationPath subscope-windows-x64.zip -Force
          $hash = (Get-FileHash subscope-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  subscope-windows-x64.zip" | Out-File SHA256SUMS.txt -Encoding ascii
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" subscope-windows-x64.zip SHA256SUMS.txt --verify-tag --title "Subscope ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
