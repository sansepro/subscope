name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        shell: cmd
        run: build.bat --ci
      - uses: actions/upload-artifact@v4
        with:
          name: subscope-windows-x64
          path: |
            bin/Subscope.exe
            LICENSE
            THIRD_PARTY.md
          if-no-files-found: error
